name: Process Handoff Staging Notes on: push: paths: - '05_Handoff_Staging/**' workflow\_dispatch: jobs: run-ledger-pipeline: runs-on: ubuntu-latest steps: - name: Check out repository uses: actions/checkout@v4 - name: Set up Python uses: actions/setup-python@v5 with: python-version: '3.11' - name: Install dependencies run: | python -m pip install --upgrade pip if [ -f requirements.txt ]; then pip install -r requirements.txt; fi - name: Execute Master Ledger Pipeline env: OPENAI\_API\_KEY: ${{ secrets.OPENAI\_API\_KEY }} ANTHROPIC\_API\_KEY: ${{ secrets.ANTHROPIC\_API\_KEY }} run: | python master\_ledger.py
